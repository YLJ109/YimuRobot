<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>YimuRobot · 机器人仿真教学系统</title>
  <style>
    /* 首屏内联样式：必须在 JS/CSS 加载前就给出深色底，避免白闪。
       色值同步自 src/assets/design-system.css 的 --bg-canvas / --text-secondary。 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #app { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', 'Microsoft YaHei', 'Segoe UI', sans-serif;
      background: #050506;
      color: #a1a1aa;
    }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px;
      background: #050506;
      color: #71717a; font-size: 13px; letter-spacing: 0.02em;
    }
    .loading-mark {
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      font-size: 15px; font-weight: 600; letter-spacing: 0.08em;
      color: #ededef;
    }
    .loading-track {
      width: 160px; height: 2px; border-radius: 2px;
      background: rgba(255,255,255,0.08); overflow: hidden;
    }
    .loading-bar {
      width: 40%; height: 100%; border-radius: 2px; background: #6366f1;
      animation: loading-slide 1.1s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    @keyframes loading-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading">
      <span class="loading-mark">YimuRobot</span>
      <div class="loading-track"><div class="loading-bar"></div></div>
      <span>正在加载机器人仿真系统…</span>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
